    />
    <!-- Stub before api.js so onload can never race the Vite module. -->
    <script>
      window.onZenbuyTurnstileLoad = function () {
        window.dispatchEvent(new Event("zenbuy-turnstile-ready"));
      };
    </script>
    <!-- defer only (no async): predictable order with the onload stub above -->
    <script
      src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=onZenbuyTurnstileLoad"
      defer
    ></script>
