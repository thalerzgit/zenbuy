# Archive ZenBuyTV, upload Dist to TestFlight (internal). No App Store review.
#
# Pattern: same Dist rails as iOS TestFlight — MANUAL App Store signing.
# NEVER -allowProvisioningUpdates. NEVER mint Development certificates.
#
# Jobs:
#   1) Validate rails — ExportOptions-tvos (manual Dist) / scheme / team / secrets.
#   2) Archive and upload — Dist p12 + tvOS App Store profile, archive with
#      CODE_SIGN_STYLE=Manual, export+upload, invite thalerz@me.com after upload.
#   3) Wait VALID — Ubuntu + ASC API only (no signing).
name: TestFlight tvOS

on:
  push:
    branches: [main]
    paths:
      - "swift/ZenBuyTV/**"
      - "swift/ExportOptions-tvos.plist"
      - "swift/Config/TVOS.xcconfig"
      - "swift/ZenBuy.xcodeproj/**"
      - "swift/ZenBuy/Core/**"
      - "swift/ZenBuy/Features/Search/SearchViewModel.swift"
      - "swift/ZenBuy/Features/Report/ReportViewModel.swift"
      - "swift/ZenBuy/Features/Report/ReportHTML.swift"
      - "swift/ZenBuy/Features/Report/ReportHTMLView.swift"
      - "swift/ZenBuy/Features/Report/ProcessingProgress.swift"
      - "swift/ZenBuy/Features/Report/ProcessingPanelView.swift"
      - "swift/ZenBuy/Components/ZenBuyBrandMark.swift"
      - "swift/ZenBuy/Components/FlowLayout.swift"
      - ".github/workflows/tvos-testflight.yml"
      - "tools/asc-tvos.mjs"
      - "!swift/**/*.md"
      - "!swift/**/*.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tvos-testflight-${{ github.ref }}
  cancel-in-progress: true

env:
  TVOS_PROJECT: ZenBuy.xcodeproj
  TVOS_SCHEME: ZenBuyTV
  TVOS_BUNDLE_ID: info.zenbuy.app
  TVOS_TEAM_ID: XQP4QUVJYY
  TVOS_TESTER_EMAIL: thalerz@me.com
  TVOS_PROFILE_NAME: CI info.zenbuy.app tvOS AppStore

jobs:
  rails:
    name: Validate rails
    runs-on: macos-26
    timeout-minutes: 20
    defaults:
      run:
        working-directory: swift
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require ASC API + Dist signing secrets
        working-directory: ${{ github.workspace }}
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_DIST_P12_BASE64: ${{ secrets.ASC_DIST_P12_BASE64 }}
          ASC_DIST_P12_PASSWORD: ${{ secrets.ASC_DIST_P12_PASSWORD }}
          ASC_PROFILE_TVOS_BASE64: ${{ secrets.ASC_PROFILE_TVOS_BASE64 }}
        run: |
          set -euo pipefail
          missing=0
          for name in ASC_ISSUER_ID ASC_KEY_ID ASC_PRIVATE_KEY ASC_DIST_P12_BASE64 ASC_DIST_P12_PASSWORD ASC_PROFILE_TVOS_BASE64; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set on this repository"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::ASC / Dist tvOS secrets missing on thalerzgit/zenbuy."
            echo "BLOCKER: stamp from Mini (never invent/commit certs):"
            echo "  ASC_ISSUER_ID, ASC_KEY_ID, ASC_PRIVATE_KEY"
            echo "  ASC_DIST_P12_BASE64 (legacy 3DES p12), ASC_DIST_P12_PASSWORD"
            echo "  ASC_PROFILE_TVOS_BASE64 (profile name: CI info.zenbuy.app tvOS AppStore)"
            echo "See docs/TVOS_TESTFLIGHT.md. Do not mint Development certs."
            exit 1
          fi
          echo "ASC API + Dist tvOS signing secrets are present (values not printed)."

      - name: Select Xcode 26.6
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          echo "Installed Xcodes:"
          ls /Applications | grep -i xcode || true
          XCODE_APP="/Applications/Xcode_26.6.app"
          if [ ! -d "${XCODE_APP}" ]; then
            echo "::error::Xcode 26.6 not found at ${XCODE_APP}"
            exit 1
          fi
          sudo xcode-select -s "${XCODE_APP}/Contents/Developer"
          XCODE_VER="$(xcodebuild -version)"
          printf '%s\n' "${XCODE_VER}"
          case "${XCODE_VER}" in
            *"Xcode 26.6"*) ;;
            *)
              echo "::error::Expected Xcode 26.6, got:"
              printf '%s\n' "${XCODE_VER}"
              exit 1
              ;;
          esac

      - name: Validate ExportOptions, scheme, bundle id, team
        run: |
          set -euo pipefail
          test -f ExportOptions-tvos.plist
          test -f ZenBuy.xcodeproj/xcshareddata/xcschemes/ZenBuyTV.xcscheme

          method=$(plutil -extract method raw -o - ExportOptions-tvos.plist)
          dest=$(plutil -extract destination raw -o - ExportOptions-tvos.plist)
          style=$(plutil -extract signingStyle raw -o - ExportOptions-tvos.plist)
          team=$(plutil -extract teamID raw -o - ExportOptions-tvos.plist)
          manage=$(plutil -extract manageAppVersionAndBuildNumber raw -o - ExportOptions-tvos.plist)
          profile=$(/usr/libexec/PlistBuddy -c 'Print :provisioningProfiles:info.zenbuy.app' ExportOptions-tvos.plist)
          [ "${method}" = "app-store-connect" ]
          [ "${dest}" = "upload" ]
          [ "${style}" = "manual" ]
          [ "${team}" = "${TVOS_TEAM_ID}" ]
          [ "${manage}" = "false" ]
          [ "${profile}" = "${TVOS_PROFILE_NAME}" ]

          grep -q "PRODUCT_BUNDLE_IDENTIFIER = ${TVOS_BUNDLE_ID};" ZenBuy.xcodeproj/project.pbxproj
          grep -q "name = ZenBuyTV;" ZenBuy.xcodeproj/project.pbxproj
          grep -q "PRODUCT_BUNDLE_IDENTIFIER = ${TVOS_BUNDLE_ID}" Config/TVOS.xcconfig
          grep -q "DEVELOPMENT_TEAM = ${TVOS_TEAM_ID}" Config/Shared.xcconfig
          grep -q 'BlueprintName = "ZenBuyTV"' ZenBuy.xcodeproj/xcshareddata/xcschemes/ZenBuyTV.xcscheme
          grep -q 'BuildableName = "ZenBuy.app"' ZenBuy.xcodeproj/xcshareddata/xcschemes/ZenBuyTV.xcscheme
          grep -q 'buildConfiguration = "Release"' ZenBuy.xcodeproj/xcshareddata/xcschemes/ZenBuyTV.xcscheme

          BRAND="ZenBuyTV/Resources/Assets.xcassets/AppIcon.brandassets/Contents.json"
          test -f "${BRAND}"
          grep -q 'primary-app-icon' "${BRAND}"
          grep -q 'top-shelf-image-wide' "${BRAND}"
          grep -q 'App Icon.imagestack' "${BRAND}"
          grep -q 'Top Shelf Image Wide.imageset' "${BRAND}"
          test -f ZenBuyTV/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName' ZenBuyTV/Info.plist | grep -qx 'App Icon'
          /usr/libexec/PlistBuddy -c 'Print :TVTopShelfImage:TVTopShelfPrimaryImageWide' ZenBuyTV/Info.plist | grep -qx 'Top Shelf Image Wide'
          grep -q 'INFOPLIST_FILE = ZenBuyTV/Info.plist' Config/TVOS.xcconfig
          test ! -d ZenBuyTV/Resources/Assets.xcassets/AppIcon.appiconset

          echo "--- xcodebuild -list ---"
          xcodebuild -list -project "${TVOS_PROJECT}" | tee "${RUNNER_TEMP}/xcodebuild-list.txt"
          grep -q "^[[:space:]]*${TVOS_SCHEME}$" "${RUNNER_TEMP}/xcodebuild-list.txt"
          echo "Rails check passed: scheme ${TVOS_SCHEME}, bundle ${TVOS_BUNDLE_ID}, team ${TVOS_TEAM_ID}, profile '${TVOS_PROFILE_NAME}' (manual Dist)."

  upload:
    name: Archive and upload
    needs: rails
    runs-on: macos-26
    timeout-minutes: 75
    outputs:
      build_number: ${{ steps.stamp.outputs.build_number }}
    defaults:
      run:
        working-directory: swift
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write App Store Connect API key
        working-directory: ${{ github.workspace }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          KEY_PATH="${RUNNER_TEMP}/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "${ASC_PRIVATE_KEY}" | sed 's/\\n/\n/g' > "${KEY_PATH}"
          if ! grep -q "BEGIN .*PRIVATE KEY" "${KEY_PATH}"; then
            {
              echo "-----BEGIN PRIVATE KEY-----"
              cat "${KEY_PATH}"
              echo "-----END PRIVATE KEY-----"
            } > "${KEY_PATH}.wrapped"
            mv "${KEY_PATH}.wrapped" "${KEY_PATH}"
          fi
          chmod 600 "${KEY_PATH}"
          echo "ASC_API_KEY_PATH=${KEY_PATH}" >> "${GITHUB_ENV}"
          echo "Wrote API key file ($(wc -c < "${KEY_PATH}") bytes). Key material not printed."

      - name: Select Xcode 26.6
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          XCODE_APP="/Applications/Xcode_26.6.app"
          if [ ! -d "${XCODE_APP}" ]; then
            echo "::error::Xcode 26.6 not found at ${XCODE_APP}"
            exit 1
          fi
          sudo xcode-select -s "${XCODE_APP}/Contents/Developer"
          XCODE_VER="$(xcodebuild -version)"
          printf '%s\n' "${XCODE_VER}"
          case "${XCODE_VER}" in
            *"Xcode 26.6"*) ;;
            *)
              echo "::error::Expected Xcode 26.6, got:"
              printf '%s\n' "${XCODE_VER}"
              exit 1
              ;;
          esac

      - name: Stamp CURRENT_PROJECT_VERSION
        id: stamp
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          OFFSET="${{ vars.TVOS_BUILD_NUMBER_OFFSET }}"
          if [ -z "${OFFSET}" ]; then
            OFFSET=5000
          fi
          case "${OFFSET}" in
            ''|*[!0-9]*)
              echo "::error::vars.TVOS_BUILD_NUMBER_OFFSET must be a non-negative integer (got '${OFFSET}')"
              exit 1
              ;;
          esac
          BUILD=$((GITHUB_RUN_NUMBER + OFFSET))
          echo "TVOS_BUILD_NUMBER=${BUILD}" >> "${GITHUB_ENV}"
          echo "build_number=${BUILD}" >> "${GITHUB_OUTPUT}"
          echo "Build ${BUILD} = GITHUB_RUN_NUMBER ${GITHUB_RUN_NUMBER} + offset ${OFFSET}"
          echo "Marketing version comes from Config/Shared.xcconfig (not stamped)."

      # READ-ONLY — never creates Bundle ID, ASC app, or tvOS platform via API.
      - name: Check App Store Connect tvOS platform exists
        working-directory: ${{ github.workspace }}
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_BUNDLE_ID: info.zenbuy.app
        run: node tools/asc-tvos.mjs ensure-app

      - name: Import Dist certificate and tvOS App Store profile
        working-directory: ${{ github.workspace }}
        env:
          ASC_DIST_P12_BASE64: ${{ secrets.ASC_DIST_P12_BASE64 }}
          ASC_DIST_P12_PASSWORD: ${{ secrets.ASC_DIST_P12_PASSWORD }}
          ASC_PROFILE_TVOS_BASE64: ${{ secrets.ASC_PROFILE_TVOS_BASE64 }}
        run: |
          set -euo pipefail
          KCH="${RUNNER_TEMP}/zenbuy-tvos.keychain-db"
          KCH_PASS="ci-${GITHUB_RUN_ID}"
          echo "TVOS_KEYCHAIN_PATH=${KCH}" >> "${GITHUB_ENV}"

          security create-keychain -p "${KCH_PASS}" "${KCH}"
          security set-keychain-settings -lut 21600 "${KCH}"
          security unlock-keychain -p "${KCH_PASS}" "${KCH}"
          security list-keychains -d user -s "${KCH}" $(security list-keychains -d user | sed 's/"//g')
          security default-keychain -s "${KCH}"

          printf '%s' "${ASC_DIST_P12_BASE64}" | tr -d '[:space:]' | base64 --decode > "${RUNNER_TEMP}/dist-raw.p12"
          if ! security import "${RUNNER_TEMP}/dist-raw.p12" -k "${KCH}" -P "${ASC_DIST_P12_PASSWORD}" \
            -T /usr/bin/codesign -T /usr/bin/security; then
            echo "Direct p12 import failed; rewrapping as legacy 3DES…"
            OPENSSL=openssl
            if [ -x /opt/homebrew/opt/openssl@3/bin/openssl ]; then
              OPENSSL=/opt/homebrew/opt/openssl@3/bin/openssl
            elif [ -x /usr/local/opt/openssl@3/bin/openssl ]; then
              OPENSSL=/usr/local/opt/openssl@3/bin/openssl
            fi
            if ! "${OPENSSL}" pkcs12 -in "${RUNNER_TEMP}/dist-raw.p12" \
              -passin pass:"${ASC_DIST_P12_PASSWORD}" -nodes -legacy -out "${RUNNER_TEMP}/dist.pem"; then
              "${OPENSSL}" pkcs12 -in "${RUNNER_TEMP}/dist-raw.p12" \
                -passin pass:"${ASC_DIST_P12_PASSWORD}" -nodes -out "${RUNNER_TEMP}/dist.pem"
            fi
            "${OPENSSL}" pkcs12 -export -in "${RUNNER_TEMP}/dist.pem" \
              -out "${RUNNER_TEMP}/dist.p12" \
              -passout pass:"${ASC_DIST_P12_PASSWORD}" \
              -legacy -descert -macalg sha1
            security import "${RUNNER_TEMP}/dist.p12" -k "${KCH}" -P "${ASC_DIST_P12_PASSWORD}" \
              -T /usr/bin/codesign -T /usr/bin/security
          fi
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KCH_PASS}" "${KCH}" >/dev/null
          echo "Signing identities:"
          security find-identity -v -p codesigning "${KCH}"
          if ! security find-identity -v -p codesigning "${KCH}" | grep -q "Apple Distribution"; then
            echo "::error::No Apple Distribution identity in CI keychain after p12 import."
            exit 1
          fi

          mkdir -p "${HOME}/Library/MobileDevice/Provisioning Profiles"
          printf '%s' "${ASC_PROFILE_TVOS_BASE64}" | tr -d '[:space:]' | base64 --decode > "${RUNNER_TEMP}/tvos.mobileprovision"
          security cms -D -i "${RUNNER_TEMP}/tvos.mobileprovision" > "${RUNNER_TEMP}/pp.plist"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "${RUNNER_TEMP}/pp.plist")
          NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "${RUNNER_TEMP}/pp.plist")
          if [ "${NAME}" != "${TVOS_PROFILE_NAME}" ]; then
            echo "::error::Installed profile name '${NAME}' != expected '${TVOS_PROFILE_NAME}'"
            exit 1
          fi
          PLATFORMS=$(/usr/libexec/PlistBuddy -c 'Print :Platform' "${RUNNER_TEMP}/pp.plist" 2>/dev/null || true)
          echo "Profile platforms: ${PLATFORMS}"
          cp "${RUNNER_TEMP}/tvos.mobileprovision" "${HOME}/Library/MobileDevice/Provisioning Profiles/${UUID}.mobileprovision"
          echo "Installed profile '${NAME}' (${UUID})."
          rm -f "${RUNNER_TEMP}/dist-raw.p12" "${RUNNER_TEMP}/dist.p12" "${RUNNER_TEMP}/dist.pem" "${RUNNER_TEMP}/tvos.mobileprovision"

      # Sign in with Apple claims complimentary APPLE_ID_WHITELIST access on TV.
      # Archiving with the entitlement against a profile that does not carry the
      # capability fails, so the profile itself decides: it is read here rather
      # than trusted from a variable, and the button is compiled out until the
      # capability is really there. Refresh ASC_PROFILE_TVOS_BASE64 after
      # regenerating the profile and the next build picks it up on its own.
      # vars.TVOS_SIGN_IN_WITH_APPLE=0 forces it off.
      - name: Resolve Sign in with Apple entitlement
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          CAPABLE=0
          if /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.applesignin' \
            "${RUNNER_TEMP}/pp.plist" >/dev/null 2>&1; then
            CAPABLE=1
          fi
          if [ "${{ vars.TVOS_SIGN_IN_WITH_APPLE }}" = "0" ]; then
            CAPABLE=0
            echo "Sign in with Apple forced OFF by vars.TVOS_SIGN_IN_WITH_APPLE=0."
          fi
          if [ "${CAPABLE}" = "1" ]; then
            echo "TVOS_ENTITLEMENTS=ZenBuyTV/ZenBuyTV.entitlements" >> "${GITHUB_ENV}"
            echo "TVOS_SWIFT_CONDITIONS=\$(inherited) ZENBUY_SIWA" >> "${GITHUB_ENV}"
            echo "Sign in with Apple ON — '${TVOS_PROFILE_NAME}' carries the capability."
          else
            echo "TVOS_ENTITLEMENTS=" >> "${GITHUB_ENV}"
            echo "TVOS_SWIFT_CONDITIONS=\$(inherited)" >> "${GITHUB_ENV}"
            echo "Sign in with Apple OFF — '${TVOS_PROFILE_NAME}' has no applesignin"
            echo "entitlement. Buy and Restore still unlock the TV allowance through"
            echo "POST /api/unlock-app. To switch it on: enable Sign in with Apple on"
            echo "App ID ${TVOS_BUNDLE_ID}, regenerate '${TVOS_PROFILE_NAME}', and refresh"
            echo "the ASC_PROFILE_TVOS_BASE64 secret. See docs/APPLE_UNLOCK_SETUP.md."
          fi

      - name: Archive
        run: |
          set -euo pipefail
          beautify() {
            if command -v xcbeautify >/dev/null 2>&1; then
              xcbeautify --renderer github-actions
            else
              cat
            fi
          }
          xcodebuild \
            -project "${TVOS_PROJECT}" \
            -scheme "${TVOS_SCHEME}" \
            -configuration Release \
            -destination 'generic/platform=tvOS' \
            -archivePath "${RUNNER_TEMP}/ZenBuyTV.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="${TVOS_TEAM_ID}" \
            PROVISIONING_PROFILE_SPECIFIER="${TVOS_PROFILE_NAME}" \
            CURRENT_PROJECT_VERSION="${TVOS_BUILD_NUMBER}" \
            CODE_SIGN_ENTITLEMENTS="${TVOS_ENTITLEMENTS}" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS="${TVOS_SWIFT_CONDITIONS}" \
            archive | beautify

      - name: Confirm archived Info.plist has tvOS icon + Top Shelf keys
        run: |
          set -euo pipefail
          APP_PLIST="${RUNNER_TEMP}/ZenBuyTV.xcarchive/Products/Applications/ZenBuy.app/Info.plist"
          test -f "${APP_PLIST}"
          echo "--- archived CFBundleIcons ---"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIcons' "${APP_PLIST}"
          echo "--- archived TVTopShelfImage ---"
          /usr/libexec/PlistBuddy -c 'Print :TVTopShelfImage' "${APP_PLIST}"
          ICON=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName' "${APP_PLIST}" 2>/dev/null || true)
          if [ -z "${ICON}" ]; then
            ICON=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundlePrimaryIcon' "${APP_PLIST}" 2>/dev/null || true)
          fi
          WIDE=$(/usr/libexec/PlistBuddy -c 'Print :TVTopShelfImage:TVTopShelfPrimaryImageWide' "${APP_PLIST}")
          [ -n "${ICON}" ]
          [ -n "${WIDE}" ]
          echo "CFBundlePrimaryIcon=${ICON}"
          echo "TVTopShelfPrimaryImageWide=${WIDE}"

      - name: Export and upload to App Store Connect
        id: export_upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          beautify() {
            if command -v xcbeautify >/dev/null 2>&1; then
              xcbeautify --renderer github-actions
            else
              cat
            fi
          }
          xcodebuild \
            -exportArchive \
            -archivePath "${RUNNER_TEMP}/ZenBuyTV.xcarchive" \
            -exportOptionsPlist ExportOptions-tvos.plist \
            -exportPath "${RUNNER_TEMP}/ZenBuyTV-export" \
            -authenticationKeyPath "${ASC_API_KEY_PATH}" \
            -authenticationKeyID "${ASC_KEY_ID}" \
            -authenticationKeyIssuerID "${ASC_ISSUER_ID}" \
            | beautify
          echo "Upload requested via ExportOptions-tvos destination=upload. No App Store review submit."
          echo "uploaded=true" >> "${GITHUB_OUTPUT}"

      - name: Invite internal TestFlight tester
        if: success() && steps.export_upload.outputs.uploaded == 'true'
        continue-on-error: true
        working-directory: ${{ github.workspace }}
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_BUNDLE_ID: info.zenbuy.app
          ASC_TESTER_EMAIL: thalerz@me.com
          ASC_GROUP_NAME: Internal Testers
        run: node tools/asc-tvos.mjs invite-tester

      - name: Remove secrets and CI keychain
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          if [ -n "${ASC_API_KEY_PATH:-}" ]; then
            rm -f "${ASC_API_KEY_PATH}"
          fi
          rm -f "${RUNNER_TEMP}"/AuthKey_*.p8
          rm -f "${RUNNER_TEMP}/dist-raw.p12" "${RUNNER_TEMP}/dist.p12" "${RUNNER_TEMP}/dist.pem"
          rm -f "${RUNNER_TEMP}/tvos.mobileprovision" "${RUNNER_TEMP}/pp.plist"
          if [ -n "${TVOS_KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "${TVOS_KEYCHAIN_PATH}" 2>/dev/null || true
          fi

  wait_valid:
    name: Wait TestFlight VALID
    needs: upload
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Wait for VALID tvOS Dist build
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_BUNDLE_ID: info.zenbuy.app
          TVOS_BUILD_NUMBER: ${{ needs.upload.outputs.build_number }}
        run: |
          set -euo pipefail
          MARKETING="$(awk '/^MARKETING_VERSION/{print $3}' swift/Config/Shared.xcconfig)"
          export ASC_MARKETING_VERSION="${MARKETING}"
          echo "ASC wait-valid: marketing ${MARKETING} Dist tvOS build ${TVOS_BUILD_NUMBER}."
          echo "No signing on this job. No App Store review submit."
          node tools/asc-tvos.mjs wait-valid
