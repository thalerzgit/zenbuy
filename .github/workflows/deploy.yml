name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Covers the Apple signed-transaction verifier, which grants
      # entitlements and so must never ship unverified.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        # Turnstile site key comes from Worker secret TURNSTILE_SITE_KEY
        # via GET /api/config at runtime — no Vite key required in CI.

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Public account id (also in wrangler.jsonc)
          accountId: "7841b36fdc9d3c3ae48bd119503d3df5"
          command: deploy --config dist/zenbuy/wrangler.json
          packageManager: npm
